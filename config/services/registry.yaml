services:
    cleverage_process.registry.process_configuration:
        class: CleverAge\ProcessBundle\Registry\ProcessConfigurationRegistry
        public: false
        arguments:
            - ~
            - ~
            - ~
            - '@logger' # Processes left out of the listings because their configuration is not valid
        tags:
            - { name: kernel.reset, method: reset }
            - { name: monolog.logger, channel: cleverage_process }
    CleverAge\ProcessBundle\Registry\ProcessConfigurationRegistry:
        alias: cleverage_process.registry.process_configuration
    CleverAge\ProcessBundle\Registry\ProcessConfigurationRegistryInterface:
        alias: cleverage_process.registry.process_configuration

    cleverage_process.registry.transformer:
        class: CleverAge\ProcessBundle\Registry\TransformerRegistry
        public: false
        arguments:
            - ~ # Service locator of the transformers by code, see TransformerLocatorCompilerPass
    CleverAge\ProcessBundle\Registry\TransformerRegistry:
        alias: cleverage_process.registry.transformer
    CleverAge\ProcessBundle\Registry\TransformerRegistryInterface:
        alias: cleverage_process.registry.transformer

    cleverage_process.registry.task:
        class: CleverAge\ProcessBundle\Registry\TaskRegistry
        public: false
        arguments:
            - ~ # Service locator of the task services, see TaskLocatorCompilerPass
            - '@service_container' # Deprecated fallback, removed in v6.0
    CleverAge\ProcessBundle\Registry\TaskRegistry:
        alias: cleverage_process.registry.task
    CleverAge\ProcessBundle\Registry\TaskRegistryInterface:
        alias: cleverage_process.registry.task
