services:
    cleverage_process.event_listener.data_queue:
        class: CleverAge\ProcessBundle\EventListener\DataQueueEventListener
        public: false
        deprecated:
            package: cleverage/process-bundle
            version: '5.4'
            message: 'The "%service_id%" service is deprecated, it will be removed in v6.0: write your own listener of the event dispatched by the event_dispatcher task.'
        tags:
            - { name: kernel.event_listener, event: cleverage_process.data_queue, method: pushData }

    cleverage_process.event_listener.signal_stop_checker:
        class: CleverAge\ProcessBundle\EventListener\SignalStopChecker
        public: false
        arguments:
            - '@?logger'
        tags:
            - { name: cleverage_process.stop_checker }
            - { name: kernel.event_listener, event: console.signal, method: onConsoleSignal }
            - { name: kernel.event_listener, event: cleverage_process.start, method: onProcessStart }
            - { name: kernel.event_listener, event: cleverage_process.end, method: onProcessEnd }
            - { name: kernel.event_listener, event: cleverage_process.fail, method: onProcessEnd }
            - { name: kernel.reset, method: reset }
            - { name: monolog.logger, channel: cleverage_process }
